name: Native iOS

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  simulator:
    name: SwiftUI build and model tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone Simulator
        id: simulator
        run: |
          xcodebuild -version
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime, entries in devices.items()
                     if "iOS" in runtime for device in entries
                     if device["name"].startswith("iPhone") and device["isAvailable"]))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Build iPhone Simulator application
        run: |
          xcodebuild -project ios/KavakHome.xcodeproj -scheme KavakHome \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Run model tests
        run: |
          xcodebuild -project ios/KavakHome.xcodeproj -scheme KavakHome \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -parallel-testing-enabled NO -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO test
